name: Linux build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    tags:
      - 'v*'

jobs:

  build_memoto_linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-latest
            dockerfile: toolchains/linux/x86_64/Dockerfile
          - architecture: arm64
            runner: ubuntu-24.04-arm
            dockerfile: toolchains/linux/arm64/Dockerfile
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Qt toolchain image
        run: |
          docker build \
            -f toolchains/Dockerfile \
            -t ghcr.io/raphaelmartin83/qt_compilation_base \
            toolchains/

      - name: Build MeMoTo image
        run: |
          docker build \
            -f ${{ matrix.dockerfile }} \
            -t memoto_linux_${{ matrix.architecture }} \
            .

      - name: Build
        run: |
          docker run --rm \
            -e OUTPUT_DIR=/var/mmt/ \
            -e MMT_TAG="${{ github.ref }}" \
            -v ${{ github.workspace }}:/var/mmt:rw \
            memoto_linux_${{ matrix.architecture }}

      - name: Persist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MeMoTo-Linux-${{ matrix.architecture }}.AppImage
          path: ${{ github.workspace }}/MeMoTo-${{ matrix.architecture }}.AppImage

  deploy_memoto_linux:
    needs: [build_memoto_linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Retrieve artifacts to release
        uses: actions/download-artifact@v4
        with:
          pattern: MeMoTo-Linux-*.AppImage
          path: ${{ github.workspace }}
          merge-multiple: true

      - name: Create release and upload artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
            sudo apt update
            sudo apt install fuse
            wget -q https://github.com/TheAssassin/pyuploadtool/releases/download/continuous/pyuploadtool-x86_64.AppImage
            chmod +x pyuploadtool-x86_64.AppImage
            ./pyuploadtool-x86_64.AppImage \
              ${{ github.workspace }}/MeMoTo-x86_64.AppImage \
              ${{ github.workspace }}/MeMoTo-arm64.AppImage
